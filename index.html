<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Professional QR Code Generator - Create custom QR codes">
    <title>QR Code Generator</title>
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    
    <!-- QR Code Library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    
    <!-- App Styles -->
    <link rel="stylesheet" href="css/app.css">
</head>
<body data-theme="dark">
    <!-- Top Bar -->
    <div class="top-bar">
        <button class="menu-toggle" id="menuToggle">
            <i class="bi bi-list"></i>
        </button>
        <div class="app-title">
            <i class="bi bi-qr-code-scan"></i>
            <span>QR Code Generator</span>
        </div>
        <div class="top-bar-actions">
            <button class="theme-indicator" id="themeIndicator"></button>
        </div>
    </div>

    <!-- App Container -->
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <nav class="sidebar-nav">
                <a href="#/" class="nav-item active" data-route="/">
                    <i class="bi bi-house-door"></i>
                    <span>All Tools</span>
                </a>
                
                <div class="nav-category">
                    <div class="category-header">
                        <i class="bi bi-grid"></i>
                        <span>QR Code Modes</span>
                    </div>
                    <div class="category-items">
                        <a href="#/url" class="nav-item" data-route="/url">
                            <i class="bi bi-link-45deg"></i>
                            <span>URL / Website</span>
                        </a>
                        <a href="#/text" class="nav-item" data-route="/text">
                            <i class="bi bi-fonts"></i>
                            <span>Plain Text</span>
                        </a>
                        <a href="#/email" class="nav-item" data-route="/email">
                            <i class="bi bi-envelope"></i>
                            <span>Email</span>
                        </a>
                        <a href="#/phone" class="nav-item" data-route="/phone">
                            <i class="bi bi-telephone"></i>
                            <span>Phone</span>
                        </a>
                        <a href="#/sms" class="nav-item" data-route="/sms">
                            <i class="bi bi-chat-dots"></i>
                            <span>SMS</span>
                        </a>
                        <a href="#/whatsapp" class="nav-item" data-route="/whatsapp">
                            <i class="bi bi-whatsapp"></i>
                            <span>WhatsApp</span>
                        </a>
                        <a href="#/wifi" class="nav-item" data-route="/wifi">
                            <i class="bi bi-wifi"></i>
                            <span>WiFi</span>
                        </a>
                        <a href="#/location" class="nav-item" data-route="/location">
                            <i class="bi bi-geo-alt"></i>
                            <span>Location</span>
                        </a>
                        <a href="#/event" class="nav-item" data-route="/event">
                            <i class="bi bi-calendar-event"></i>
                            <span>Calendar Event</span>
                        </a>
                        <a href="#/appstore" class="nav-item" data-route="/appstore">
                            <i class="bi bi-shop"></i>
                            <span>App Store</span>
                        </a>
                        <a href="#/social" class="nav-item" data-route="/social">
                            <i class="bi bi-share"></i>
                            <span>Social Media</span>
                        </a>
                        <a href="#/vcard" class="nav-item" data-route="/vcard">
                            <i class="bi bi-person-vcard"></i>
                            <span>vCard</span>
                        </a>
                    </div>
                </div>
                
                <a href="#/settings" class="nav-item" data-route="/settings">
                    <i class="bi bi-gear"></i>
                    <span>Settings</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">
            <!-- Content will be loaded here dynamically -->
        </main>
    </div>

    <!-- Core Scripts -->
    <script src="js/theme.js"></script>
    <script src="js/router.js"></script>
    <script src="js/qr-utils.js"></script>
    
    <!-- QR Mode Modules -->
    <script src="modules/home.js"></script>
    <script src="modules/settings.js"></script>
    <script src="modules/qr-modes/url.js"></script>
    <script src="modules/qr-modes/text.js"></script>
    <script src="modules/qr-modes/email.js"></script>
    <script src="modules/qr-modes/phone.js"></script>
    <script src="modules/qr-modes/sms.js"></script>
    <script src="modules/qr-modes/whatsapp.js"></script>
    <script src="modules/qr-modes/wifi.js"></script>
    <script src="modules/qr-modes/location.js"></script>
    <script src="modules/qr-modes/event.js"></script>
    <script src="modules/qr-modes/appstore.js"></script>
    <script src="modules/qr-modes/social.js"></script>
    <script src="modules/qr-modes/vcard.js"></script>
    
    <!-- App Initialization -->
    <script src="js/app.js"></script>
</body>
</html>
