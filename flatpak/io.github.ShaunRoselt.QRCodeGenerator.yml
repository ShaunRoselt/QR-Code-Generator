app-id: io.github.ShaunRoselt.QRCodeGenerator
branch: stable
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: io.github.ShaunRoselt.QRCodeGenerator
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: qr-code-generator
    buildsystem: simple
    build-commands:
      - install -d /app/bin
      - install -d /app/lib/io.github.ShaunRoselt.QRCodeGenerator
      - install -d /app/share/applications
      - install -d /app/share/icons/hicolor/64x64/apps
      - install -d /app/share/icons/hicolor/128x128/apps
      - install -d /app/share/icons/hicolor/256x256/apps
      - install -d /app/share/icons/hicolor/512x512/apps
      - install -d /app/share/icons/hicolor/scalable/apps
      - install -d /app/share/metainfo
      - cp -a "QR Code Generator-linux-x64" "/app/lib/io.github.ShaunRoselt.QRCodeGenerator/QR Code Generator"
      - install -Dm755 io.github.ShaunRoselt.QRCodeGenerator.sh /app/bin/io.github.ShaunRoselt.QRCodeGenerator
      - install -Dm644 io.github.ShaunRoselt.QRCodeGenerator.desktop /app/share/applications/io.github.ShaunRoselt.QRCodeGenerator.desktop
      - install -Dm644 io.github.ShaunRoselt.QRCodeGenerator.metainfo.xml /app/share/metainfo/io.github.ShaunRoselt.QRCodeGenerator.metainfo.xml
      - install -Dm644 io.github.ShaunRoselt.QRCodeGenerator.png /app/share/icons/hicolor/64x64/apps/io.github.ShaunRoselt.QRCodeGenerator.png
      - install -Dm644 io.github.ShaunRoselt.QRCodeGenerator.png /app/share/icons/hicolor/128x128/apps/io.github.ShaunRoselt.QRCodeGenerator.png
      - install -Dm644 io.github.ShaunRoselt.QRCodeGenerator.png /app/share/icons/hicolor/256x256/apps/io.github.ShaunRoselt.QRCodeGenerator.png
      - install -Dm644 io.github.ShaunRoselt.QRCodeGenerator.png /app/share/icons/hicolor/512x512/apps/io.github.ShaunRoselt.QRCodeGenerator.png
      - install -Dm644 io.github.ShaunRoselt.QRCodeGenerator.svg /app/share/icons/hicolor/scalable/apps/io.github.ShaunRoselt.QRCodeGenerator.svg
    sources:
      - type: dir
        path: ../dist/QR Code Generator-linux-x64
        dest: QR Code Generator-linux-x64
      - type: file
        path: io.github.ShaunRoselt.QRCodeGenerator.sh
      - type: file
        path: io.github.ShaunRoselt.QRCodeGenerator.desktop
      - type: file
        path: io.github.ShaunRoselt.QRCodeGenerator.metainfo.xml
      - type: file
        path: ../assets/favicon.png
        dest-filename: io.github.ShaunRoselt.QRCodeGenerator.png
      - type: file
        path: ../assets/favicon.svg
        dest-filename: io.github.ShaunRoselt.QRCodeGenerator.svg